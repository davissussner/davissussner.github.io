<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff4dc">
<title>Class Picker</title>
<meta name="description" content="Pick a student at random with a balloon pop, wheel spin, marble race or horse race. Fair turns so everyone gets picked before anyone goes twice.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script type="module" src="js/main.js?v=7"></script>
</head>
<body>

<main id="home" class="screen">
  <header class="top">
    <h1>🍎 Class Picker</h1>
    <button type="button" class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
  </header>

  <section class="card">
    <div class="card-head">
      <h2>Your class</h2>
      <span id="here-count" class="pill"></span>
    </div>
    <p class="hint">Paste your class list (one name per line, or separated by commas). Tap a name to mark them absent today.</p>
    <form id="add-form" autocomplete="off">
      <textarea id="add-names" rows="3" placeholder="Maya&#10;Leo&#10;Priya, Sam, Jordan…" aria-label="Names to add"></textarea>
      <button type="submit" class="btn">Add names</button>
    </form>
    <p id="add-note" class="note hidden"></p>
    <ul id="roster" class="roster"></ul>
    <div class="quick">
      <button type="button" id="all-here" class="link">Everyone's here</button>
      <button type="button" id="reset-turns" class="link">Reset turns</button>
      <button type="button" id="clear-all" class="link danger">Clear list</button>
    </div>
  </section>

  <section class="card">
    <h2>Options</h2>
    <label class="toggle-row">
      <input type="checkbox" id="fair-turns" checked>
      <span><b>Fair turns</b><br><span class="hint-inline">Nobody gets picked twice until everyone's had a turn.</span></span>
    </label>
  </section>

  <section class="card">
    <h2>Pick a game</h2>
    <p class="hint" id="play-hint"></p>
    <div id="modes" class="modes"></div>
  </section>

  <p class="fine">Every student has exactly the same chance in every game.</p>
</main>

<section id="game" class="screen hidden">
  <header class="game-bar">
    <button type="button" id="quit" class="icon-btn" aria-label="Back to class list">←</button>
    <h2 id="game-title"></h2>
    <button type="button" class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
  </header>
  <div class="stage">
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
  </div>
</section>

<div id="result" class="overlay hidden" role="dialog" aria-live="assertive">
  <canvas id="confetti"></canvas>
  <div class="result-card">
    <div class="result-kicker">And the pick is…</div>
    <div id="result-name" class="result-name"></div>
    <div class="result-car">🎉</div>
    <div id="result-shot" class="hidden"><b id="shot-name"></b></div>
    <p id="result-note" class="result-note hidden"></p>
    <div class="result-actions">
      <button type="button" id="again" class="btn">Pick again</button>
      <button type="button" id="change" class="btn ghost">Change game</button>
    </div>
  </div>
</div>

</body>
</html>
